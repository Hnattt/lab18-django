<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Пристрій</title></head><body><h1>{{ device.name }}</h1><p>Серійний номер: {{ device.serial }}</p><h2>Вимірювання</h2><ul>{% for m in measurements %}<li data-measurement-id="{{ m.pk }}" data-below="{% if m.temperature < 0 %}true{% else %}false{% endif %}">{{ m.measured_at|date:'c' }}: {{ m.temperature }} °C{% if m.temperature < 0 %} <strong>Нижче 0 °C</strong>{% endif %}</li>{% empty %}<li>Немає вимірювань</li>{% endfor %}</ul><a href="{% url 'monitoring:index' %}">Усі пристрої</a></body></html>
